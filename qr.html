<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitster QR-Codes</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
    }

    .info {
        text-align: center;
        margin-bottom: 25px;
        color: #ccc;
    }

    #codes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
        max-width: 1200px;
        margin: auto;
    }

    .card {
        background: white;
        color: black;
        padding: 15px;
        text-align: center;
        border-radius: 10px;
    }

    .number {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .qr {
        display: flex;
        justify-content: center;
    }

    .url {
        font-size: 9px;
        margin-top: 8px;
        word-break: break-all;
        color: #555;
    }

    @media print {
        body {
            background: white;
            color: black;
        }

        h1, .info {
            display: none;
        }

        #codes {
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .card {
            border: 1px solid #aaa;
            border-radius: 0;
            break-inside: avoid;
        }
    }
</style>
</head>

<body>

<h1>Hitster QR-Codes</h1>

<div class="info">
    1000 QR-Codes für deine Hitster-Karten
</div>

<div id="codes"></div>

<script>

const baseURL = "https://frosch339.github.io/Hitster/?karte=";

const container = document.getElementById("codes");

for (let i = 1; i <= 1000; i++) {

    const card = document.createElement("div");
    card.className = "card";

    const number = document.createElement("div");
    number.className = "number";
    number.textContent = "Karte #" + String(i).padStart(3, "0");

    const qr = document.createElement("div");
    qr.className = "qr";

    const url = document.createElement("div");
    url.className = "url";
    url.textContent = baseURL + i;

    card.appendChild(number);
    card.appendChild(qr);
    card.appendChild(url);

    container.appendChild(card);

    new QRCode(qr, {
        text: baseURL + i,
        width: 140,
        height: 140,
        correctLevel: QRCode.CorrectLevel.M
    });
}

</script>

</body>
</html>
