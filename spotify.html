<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotify verbinden</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .box {
        padding: 30px;
        max-width: 500px;
    }

    button {
        background: #1DB954;
        color: white;
        border: none;
        border-radius: 30px;
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1ed760;
    }
</style>
</head>

<body>

<div class="box">

    <h1>🎵 Hitster</h1>

    <p>
        Der Spielmacher verbindet jetzt Spotify.
    </p>

    <button id="login">
        Mit Spotify verbinden
    </button>

</div>

<script>

const CLIENT_ID = "fc0ca59e363f454ca125c7dcdf6b723c";

const REDIRECT_URI =
    "https://frosch339.github.io/Hitster/callback.html";


/* PKCE Code Verifier erzeugen */

function generateCodeVerifier(length = 64) {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

    let result = "";

    const values =
        crypto.getRandomValues(new Uint8Array(length));

    for (let i = 0; i < length; i++) {

        result +=
            characters[values[i] % characters.length];

    }

    return result;
}


/* Code Challenge erzeugen */

async function generateCodeChallenge(verifier) {

    const data =
        new TextEncoder().encode(verifier);

    const digest =
        await crypto.subtle.digest("SHA-256", data);

    return btoa(
        String.fromCharCode(...new Uint8Array(digest))
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");

}


/* Spotify Login */

document.getElementById("login").addEventListener("click", async () => {

    const verifier =
        generateCodeVerifier();

    const challenge =
        await generateCodeChallenge(verifier);

    localStorage.setItem(
        "spotify_code_verifier",
        verifier
    );


    const scopes = [
        "streaming",
        "user-read-email",
        "user-read-private",
        "user-modify-playback-state"
    ].join(" ");


    const params = new URLSearchParams({

        client_id: CLIENT_ID,

        response_type: "code",

        redirect_uri: REDIRECT_URI,

        scope: scopes,

        code_challenge_method: "S256",

        code_challenge: challenge

    });

    localStorage.setItem(
    "spotify_return_url",
    window.location.href
);

    window.location.href =
        "https://accounts.spotify.com/authorize?" +
        params.toString();

});

</script>

</body>
</html>
