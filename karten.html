<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hitster – Karten Vorschau</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 40px;
    background: #222;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   KARTE
========================= */

.card {
    width: 63mm;
    height: 88mm;
    margin: 30px auto;

    position: relative;
    overflow: hidden;

    border-radius: 4mm;

    background:
        radial-gradient(circle at 50% 35%, #ff5aa8 0%, #e90068 38%, #9d004b 100%);

    box-shadow:
        0 8px 25px rgba(0,0,0,0.5);

    color: white;
}

/* dekorative Kreise */

.card::before {
    content: "";
    position: absolute;

    width: 110mm;
    height: 110mm;

    left: -24mm;
    top: 17mm;

    border-radius: 50%;

    border: 2mm solid rgba(255,255,255,0.10);

    box-shadow:
        0 0 0 6mm rgba(255,255,255,0.04),
        0 0 0 12mm rgba(255,255,255,0.03);

    transform: rotate(-20deg);
}

.card::after {
    content: "♪";
    position: absolute;

    right: -5mm;
    top: -10mm;

    font-size: 55mm;
    font-weight: bold;

    color: rgba(255,255,255,0.08);

    transform: rotate(15deg);
}

/* =========================
   KARTENNUMMER
========================= */

.card-number {
    position: absolute;

    top: 7mm;
    left: 0;
    right: 0;

    text-align: center;

    font-size: 7mm;
    font-weight: 900;
    letter-spacing: 0.5mm;

    z-index: 5;
}

/* =========================
   MUSIKSYMBOL
========================= */

.music {

    position: absolute;

    top: 20mm;
    left: 50%;

    transform: translateX(-50%);

    width: 32mm;
    height: 32mm;

    border-radius: 50%;

    background: rgba(255,255,255,0.95);

    box-shadow:
        0 3mm 7mm rgba(0,0,0,0.25);

    z-index: 5;
}

.music::before {
    content: "";

    position: absolute;

    width: 15mm;
    height: 15mm;

    border-radius: 50%;

    background: #c9005b;

    left: 8.5mm;
    top: 8.5mm;
}

.music::after {
    content: "♪";

    position: absolute;

    color: white;

    font-size: 16mm;

    left: 9mm;
    top: 4mm;
}

/* =========================
   QR CODE
========================= */

.qr-wrapper {

    position: absolute;

    bottom: 9mm;
    left: 50%;

    transform: translateX(-50%);

    width: 35mm;
    height: 35mm;

    padding: 2mm;

    background: white;

    border-radius: 2mm;

    z-index: 10;
}

#qr {
    width: 31mm;
    height: 31mm;
}

/* =========================
   UNTERER TEXT
========================= */

.scan {

    position: absolute;

    bottom: 5mm;
    left: 0;
    right: 0;

    text-align: center;

    font-size: 3mm;
    font-weight: bold;

    z-index: 15;

    transform: translateY(0);
}

/* =========================
   RÜCKSEITE
========================= */

.answer-card {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 8mm;

}

.answer-card .small {
    font-size: 4mm;
    opacity: 0.85;
    margin-bottom: 6mm;
}

.answer-card .artist {
    font-size: 6mm;
    font-weight: 900;
    margin-bottom: 4mm;
}

.answer-card .title {
    font-size: 5mm;
    font-style: italic;
    margin-bottom: 7mm;
}

.answer-card .year {
    font-size: 10mm;
    font-weight: 900;
}

/* =========================
   DRUCK
========================= */

@media print {

    body {
        background: white;
        padding: 0;
    }

    .card {
        margin: 0;
        box-shadow: none;
    }

}

</style>

</head>

<body>

<!-- =========================
     VORDERSEITE
========================= -->

<div class="card">

    <div class="card-number">
        KARTE #001
    </div>

    <div class="music"></div>

    <div class="qr-wrapper">
        <div id="qr"></div>
    </div>

</div>


<!-- =========================
     RÜCKSEITE
========================= -->

<div class="card answer-card">

    <div class="small">
        DIE LÖSUNG
    </div>

    <div class="artist">
        Elvis Presley
    </div>

    <div class="title">
        A Big Hunk o' Love
    </div>

    <div class="year">
        1959
    </div>

</div>


<script>

new QRCode(document.getElementById("qr"), {

    text: "https://frosch339.github.io/Hitster/?karte=1",

    width: 117,
    height: 117,

    correctLevel: QRCode.CorrectLevel.M

});

</script>

</body>
</html>
