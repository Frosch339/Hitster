<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitster Karte #001</title>

<style>

@page {
  size: 65mm 65mm;
  margin: 0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px;
  background: #eeeeee;
  font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   KARTE
========================= */

.card {
  position: relative;

  width: 65mm;
  height: 65mm;

  margin: 0 auto 30px;

  background: #080808;

  overflow: hidden;

  border-radius: 3mm;

  box-shadow:
    0 8px 25px rgba(0,0,0,0.25);
}


/* =========================
   VINYL-LINIEN
========================= */

.vinyl {
  position: absolute;

  width: 100%;
  height: 100%;

  left: 0;
  top: 0;

  pointer-events: none;
}


/* einzelne Ringe */

.ring {
  position: absolute;

  border-radius: 50%;

  border-style: solid;

  opacity: 0.85;
}


/* Farben */

.r1 {
  width: 125%;
  height: 125%;
  left: -12.5%;
  top: -12.5%;

  border-width: 1.2px;

  border-color: #668f8a;
}

.r2 {
  width: 110%;
  height: 110%;
  left: -5%;
  top: -5%;

  border-width: 1px;

  border-color: #c87968;
}

.r3 {
  width: 96%;
  height: 96%;
  left: 2%;
  top: 2%;

  border-width: 1px;

  border-color: #b59b58;
}

.r4 {
  width: 84%;
  height: 84%;
  left: 8%;
  top: 8%;

  border-width: 1px;

  border-color: #7c759b;
}

.r5 {
  width: 72%;
  height: 72%;
  left: 14%;
  top: 14%;

  border-width: 1px;

  border-color: #668f8a;
}

.r6 {
  width: 60%;
  height: 60%;
  left: 20%;
  top: 20%;

  border-width: 1px;

  border-color: #c87968;
}

.r7 {
  width: 48%;
  height: 48%;
  left: 26%;
  top: 26%;

  border-width: 1px;

  border-color: #b59b58;
}

.r8 {
  width: 36%;
  height: 36%;
  left: 32%;
  top: 32%;

  border-width: 1px;

  border-color: #7c759b;
}


/* =========================
   QR-BEREICH
========================= */

.qr-area {

  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: 31mm;
  height: 31mm;

  background: white;

  padding: 3mm;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 10;
}


/* =========================
   RÜCKSEITE
========================= */

.back {

  display: flex;

  flex-direction: column;

  align-items: center;

  text-align: center;

  color: #f4f1ea;

  padding: 8mm 5mm;

}


/* Interpret */

.artist {

  position: relative;

  z-index: 10;

  font-size: 5mm;

  font-weight: 700;

  letter-spacing: 0.4mm;

  text-transform: uppercase;

  margin-top: 1mm;

  max-width: 90%;
}


/* Jahr */

.year {

  position: relative;

  z-index: 10;

  font-size: 18mm;

  line-height: 1;

  font-weight: 900;

  margin-top: 9mm;

  margin-bottom: 7mm;

  letter-spacing: -0.5mm;
}


/* Song */

.song {

  position: relative;

  z-index: 10;

  font-size: 4.2mm;

  line-height: 1.2;

  font-weight: 600;

  max-width: 90%;
}


/* =========================
   ÜBERSCHRIFTEN AUẞERHALB
========================= */

.preview-title {

  text-align: center;

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 15px;

  color: #222;
}


/* =========================
   DRUCK
========================= */

@media print {

  body {

    padding: 0;

    background: white;

  }

  .preview-title {

    display: none;

  }

  .card {

    margin: 0;

    box-shadow: none;

    border-radius: 0;

  }

}

</style>

</head>

<body>


<div class="preview-title">
  Vorderseite
</div>


<!-- =========================
     VORDERSEITE
========================= -->

<div class="card">

  <div class="vinyl">

    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="ring r5"></div>
    <div class="ring r6"></div>
    <div class="ring r7"></div>
    <div class="ring r8"></div>

  </div>


  <div class="qr-area" id="qrcode"></div>

</div>



<div class="preview-title">
  Rückseite
</div>


<!-- =========================
     RÜCKSEITE
========================= -->

<div class="card back">

  <div class="vinyl">

    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="ring r5"></div>
    <div class="ring r6"></div>
    <div class="ring r7"></div>
    <div class="ring r8"></div>

  </div>


  <div class="artist">
    Elvis Presley
  </div>


  <div class="year">
    1959
  </div>


  <div class="song">
    A Big Hunk o' Love
  </div>

</div>



<!-- QR-Code Bibliothek -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

new QRCode(
  document.getElementById("qrcode"),
  {
    text:
      "https://frosch339.github.io/Hitster/?karte=1",

    width: 90,
    height: 90,

    correctLevel:
      QRCode.CorrectLevel.M
  }
);

</script>


</body>
</html>
