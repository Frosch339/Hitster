
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Förschls Hitster – Kartendruck</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
@page {
  size: A4 portrait;
  margin: 0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #e9e9e9;
  font-family: Arial, Helvetica, sans-serif;
}

.controls {
  text-align: center;
  margin: 0 auto 20px;
}

.controls button {
  padding: 12px 22px;
  font-size: 16px;
  cursor: pointer;
}

#status {
  margin: 12px;
  font-weight: bold;
}

/* DRUCKBOGEN */

.sheet {
  width: 210mm;
  height: 297mm;
  padding: 18.5mm 7.5mm;
  margin: 0 auto 20px;
  background: white;
  display: grid;
  grid-template-columns: repeat(3, 65mm);
  grid-template-rows: repeat(4, 65mm);
  column-gap: 0mm;
  row-gap: 0mm;
  gap: 0mm;
  position: relative;
  page-break-after: always;
  break-after: page;
}

/* KARTEN */

.card {
  width: 65mm;
  height: 65mm;
  margin: 0;
  padding: 0;
  position: relative;
  overflow: hidden;
  border-radius: 0;
}

/* VORDERSEITE */

.front {
  background: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ring,
.open-ring {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border-style: solid;
  pointer-events: none;
}

.ring1 {
  width: 62mm;
  height: 62mm;
  border-width: 1.2mm;
  border-color: #00b8a9;
  opacity: 0.85;
}

.ring2 {
  width: 54mm;
  height: 54mm;
  border-width: 1.3mm;
  border-color: #ff5c5c;
  opacity: 0.85;
}

.ring3 {
  width: 46mm;
  height: 46mm;
  border-width: 1.2mm;
  border-color: #ffc857;
  opacity: 0.9;
}

.ring4 {
  width: 38mm;
  height: 38mm;
  border-width: 1.3mm;
  border-color: #8b6cff;
  opacity: 0.9;
}

.open1 {
  width: 60mm;
  height: 60mm;
  border-width: 1.3mm;
  border-color: #ff8a3d;
  border-left-color: transparent;
  border-bottom-color: transparent;
  transform: translate(-50%, -50%) rotate(25deg);
}

.open2 {
  width: 52mm;
  height: 52mm;
  border-width: 1.4mm;
  border-color: #00d4ff;
  border-right-color: transparent;
  border-top-color: transparent;
  transform: translate(-50%, -50%) rotate(-20deg);
}

.open3 {
  width: 44mm;
  height: 44mm;
  border-width: 1.3mm;
  border-color: #ff4fa3;
  border-left-color: transparent;
  border-top-color: transparent;
  transform: translate(-50%, -50%) rotate(45deg);
}

.qr-area {
  position: relative;
  z-index: 10;
  width: 38mm;
  height: 38mm;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  padding: 1mm;
  border-radius: 0.8mm;
}

.qr {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qr img,
.qr canvas {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

/* RÜCKSEITE */

.back {
  color: #050505;
  display: flex;
  flex-direction: column;
  position: relative;
}

.back.color-0 { background: #F5F0E5; }
.back.color-1 { background: #EEF3E9; }
.back.color-2 { background: #EAF1F5; }
.back.color-3 { background: #F6EBE5; }
.back.color-4 { background: #F0ECF5; }

.artist {
  position: relative;
  z-index: 5;
  text-align: center;
  margin-top: 7mm;
  padding: 0 5mm;
  font-size: 5mm;
  font-weight: 700;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.year {
  position: absolute;
  z-index: 5;
  top: 50%;
  left: 0;
  right: 0;
  transform: translateY(-50%);
  text-align: center;
  font-size: 17mm;
  font-weight: 900;
  letter-spacing: -0.5mm;
}

.title {
  position: absolute;
  z-index: 5;
  left: 4mm;
  right: 4mm;
  bottom: 6mm;
  text-align: center;
  font-size: 4.5mm;
  font-weight: 700;
  line-height: 1.15;
  overflow-wrap: anywhere;
}

.card-number {
  position: absolute;
  z-index: 10;
  left: 2.5mm;
  bottom: 2mm;
  font-size: 2.4mm;
  font-weight: 600;
  color: #050505;
  opacity: 0.65;
}

/* SCHNITTMARKIERUNGEN
   Nur auf der Rückseite.
   Kurze Markierungen außerhalb der Karten.
   Keine durchgehenden Linien.
*/

/* SCHNITTLINIEN – NUR RÜCKSEITE */

.crop-overlay {
  position: absolute;
  inset: 0;
  width: 210mm;
  height: 297mm;
  pointer-events: none;
  z-index: 50;
}

.crop-line {
  position: absolute;
  background: #999;
}

.crop-line.vertical {
  width: 0.2mm;
}

.crop-line.horizontal {
  height: 0.2mm;
}
/* Horizontale Schnittlinien */

.crop-cell::before,
.crop-cell::after {
  content: "";
  position: absolute;
  width: 3mm;
  height: 0;
  border-top: 0.2mm solid #999;
}

.crop-cell::before {
  top: 0;
  left: -3mm;
}

.crop-cell::after {
  top: 0;
  right: -3mm;
}

/* Vertikale Schnittlinien */

.crop-mark {
  position: absolute;
  width: 0;
  height: 3mm;
  border-left: 0.2mm solid #999;
}

.crop-mark.left {
  top: -3mm;
  left: 0;
}

.crop-mark.right {
  top: -3mm;
  right: 0;
}

/* DRUCK */

@media print {
  html,
  body {
    width: 210mm;
    margin: 0 !important;
    padding: 0 !important;
    background: white;
  }

  .controls {
    display: none !important;
  }

  .sheet {
  width: 210mm;
  height: 297mm;
  padding: 18.5mm 7.5mm;
  margin: 0 auto 20px;
  background: white;
  display: grid;
  grid-template-columns: repeat(3, 65mm);
  grid-template-rows: repeat(4, 65mm);
  column-gap: 0;
  row-gap: 0;
  position: relative;
  page-break-after: always;
  break-after: page;
}

  .sheet:last-child {
    break-after: auto;
    page-break-after: auto;
  }
}
</style>
</head>

<body>

<div class="controls">
  <h1>Förschls Hitster – Kartendruck</h1>
  <div id="status">Songliste wird geladen ...</div>
  <button onclick="window.print()">Drucken</button>
</div>

<div id="output"></div>

<script>
const SONGS_URL = "./songs.js";
const BASE_URL = "https://frosch339.github.io/Hitster/?karte=";

const output = document.getElementById("output");
const status = document.getElementById("status");


/* KARTE ERSTELLEN */

function createCard(song, side) {
  const card = document.createElement("div");
  const number = Number(song.id);
  const padded = String(number).padStart(3, "0");

  if (side === "front") {

    card.className = "card front";

    const rings = `
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>
      <div class="ring ring4"></div>

      <div class="open-ring open1"></div>
      <div class="open-ring open2"></div>
      <div class="open-ring open3"></div>

      <div class="qr-area">
        <div class="qr"></div>
      </div>
    `;

    card.innerHTML = rings;

    new QRCode(card.querySelector(".qr"), {
      text: BASE_URL + number,
      width: 150,
      height: 150,
      correctLevel: QRCode.CorrectLevel.M
    });

  } else {

    const color = (number - 1) % 5;
    card.className = `card back color-${color}`;

    const artist = document.createElement("div");
    artist.className = "artist";
    artist.textContent = song.artist || "";

    const year = document.createElement("div");
    year.className = "year";
    year.textContent = song.year || "";

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = song.title || "";

    const cardNumber = document.createElement("div");
    cardNumber.className = "card-number";
    cardNumber.textContent = "#" + padded;

    card.append(artist, year, title, cardNumber);
  }

  return card;
}


/* SCHNITTMARKIERUNGEN ERSTELLEN */

function createCropOverlay(sheet) {
  const overlay = document.createElement("div");
  overlay.className = "crop-overlay";

  function addLine(type, left, top, length) {
    const line = document.createElement("div");
    line.className = `crop-line ${type}`;

    line.style.left = `${left}mm`;
    line.style.top = `${top}mm`;

    if (type === "vertical") {
      line.style.height = `${length}mm`;
    } else {
      line.style.width = `${length}mm`;
    }

    overlay.appendChild(line);
  }

  // Senkrechte Schnittmarkierungen oben und unten
  [7.5, 72.5, 137.5, 202.5].forEach(x => {
    addLine("vertical", x, 0, 18.5);
    addLine("vertical", x, 278.5, 18.5);
  });

  // Waagerechte Schnittmarkierungen links und rechts
  [18.5, 83.5, 148.5, 213.5, 278.5].forEach(y => {
    addLine("horizontal", 0, y, 7.5);
    addLine("horizontal", 202.5, y, 7.5);
  });

  sheet.appendChild(overlay);
}


/* DRUCKBÖGEN ERSTELLEN */

function createSheets(songs) {
  const sorted = [...songs].sort(
    (a, b) => Number(a.id) - Number(b.id)
  );

  for (let start = 0; start < sorted.length; start += 12) {
    const batch = sorted.slice(start, start + 12);

    /* VORDERSEITE */

    const frontSheet = document.createElement("div");
    frontSheet.className = "sheet";

    batch.forEach(song => {
      frontSheet.appendChild(createCard(song, "front"));
    });

    // Vorderseite bewusst OHNE Schnittmarkierungen
    output.appendChild(frontSheet);


    /* RÜCKSEITE */

    const backSheet = document.createElement("div");
    backSheet.className = "sheet";

    for (let row = 0; row < 4; row++) {
      for (let col = 2; col >= 0; col--) {
        const index = row * 3 + col;

        if (batch[index]) {
          backSheet.appendChild(
            createCard(batch[index], "back")
          );
        } else {
          backSheet.appendChild(
            document.createElement("div")
          );
        }
      }
    }

    // Schnittmarkierungen NUR auf der Rückseite
    createCropOverlay(backSheet);

    output.appendChild(backSheet);
  }

  status.textContent =
    `${sorted.length} Songs geladen – ${Math.ceil(sorted.length / 12)} Vorder- und Rückseitenpaare erstellt.`;
}


/* SONGS LADEN */

function loadSongs() {
  const script = document.createElement("script");
  script.src = SONGS_URL;

  script.onload = () => {
    if (!Array.isArray(window.songs)) {
      status.textContent =
        "Fehler: window.songs wurde nicht gefunden.";
      return;
    }

    createSheets(window.songs);
  };

  script.onerror = () => {
    status.textContent =
      "Fehler beim Laden der songs.js.";
  };

  document.head.appendChild(script);
}

loadSongs();
</script>

</body>
</html>
