<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hitster Player</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .box {
        width: 90%;
        max-width: 500px;
    }

    button {
        padding: 15px 25px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin: 10px;
    }

    #start {
        background: #1db954;
        color: white;
    }

    #status {
        margin-top: 20px;
        color: #ccc;
        line-height: 1.6;
    }
</style>
</head>

<body>

<div class="box">

    <h1>🎵 Hitster</h1>

    <button id="start">
        ▶️ Song starten
    </button>

    <div id="status">
        Player wird vorbereitet...
    </div>

</div>


<script src="https://sdk.scdn.co/spotify-player.js"></script>

<script>

const CLIENT_ID = "fc0ca59e363f454ca125c7dcdf6b723c";

let player = null;
let deviceId = null;


/* =========================
   TOKEN
========================= */

function getAccessToken() {

    const token =
        localStorage.getItem("spotify_access_token");

    const expires =
        Number(
            localStorage.getItem(
                "spotify_token_expires_at"
            )
        );

    if (!token) {
        return null;
    }

    if (expires && Date.now() >= expires) {
        return null;
    }

    return token;
}


/* =========================
   STATUS
========================= */

function setStatus(text) {

    document.getElementById("status").textContent =
        text;

}


/* =========================
   SPOTIFY PLAYER
========================= */

window.onSpotifyWebPlaybackSDKReady = () => {

    const token = getAccessToken();

    if (!token) {

        setStatus(
            "❌ Keine gültige Spotify-Verbindung."
        );

        return;
    }


    player = new Spotify.Player({

        name: "Hitster",

        getOAuthToken: callback => {

            const token =
                getAccessToken();

            callback(token);

        },

        volume: 0.8

    });


    player.addListener(
        "ready",
        ({ device_id }) => {

            deviceId = device_id;

            setStatus(
                "✅ Spotify Player bereit."
            );

        }
    );


    player.addListener(
        "not_ready",
        ({ device_id }) => {

            setStatus(
                "⚠️ Spotify Player nicht verfügbar."
            );

        }
    );


    player.addListener(
        "initialization_error",
        ({ message }) => {

            setStatus(
                "❌ Initialisierungsfehler: " +
                message
            );

        }
    );


    player.addListener(
        "authentication_error",
        ({ message }) => {

            setStatus(
                "❌ Spotify-Anmeldung abgelaufen."
            );

        }
    );


    player.addListener(
        "account_error",
        ({ message }) => {

            setStatus(
                "❌ Spotify Premium wird benötigt."
            );

        }
    );


    player.connect();

};


/* =========================
   SONG #001 TEST
========================= */

document.getElementById("start").onclick =
async () => {

    const token = getAccessToken();

    if (!token) {

        setStatus(
            "❌ Spotify ist nicht verbunden."
        );

        return;
    }


    if (!deviceId) {

        setStatus(
            "⏳ Spotify Player wird noch vorbereitet..."
        );

        return;
    }


    setStatus(
        "🔎 Suche Song..."
    );


    try {

        /*
         * Song #001:
         * Elvis Presley
         * A Big Hunk o' Love
         */

        const query =
            encodeURIComponent(
                "Elvis Presley A Big Hunk o' Love"
            );


        const searchResponse =
            await fetch(
                "https://api.spotify.com/v1/search?q=" +
                query +
                "&type=track&limit=1",
                {
                    headers: {
                        Authorization:
                            "Bearer " + token
                    }
                }
            );


        const searchData =
            await searchResponse.json();


        if (!searchResponse.ok) {

            throw new Error(
                searchData.error?.message ||
                "Spotify-Suche fehlgeschlagen."
            );

        }


        if (
            !searchData.tracks ||
            searchData.tracks.items.length === 0
        ) {

            throw new Error(
                "Song wurde nicht gefunden."
            );

        }


        const track =
            searchData.tracks.items[0];


        setStatus(
            "▶️ Starte Song..."
        );


        const playResponse =
            await fetch(
                "https://api.spotify.com/v1/me/player/play?device_id=" +
                encodeURIComponent(deviceId),
                {
                    method: "PUT",

                    headers: {
                        Authorization:
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        uris: [
                            track.uri
                        ]
                    })
                }
            );


        if (!playResponse.ok) {

            const errorData =
                await playResponse.json();

            throw new Error(
                errorData.error?.message ||
                "Wiedergabe konnte nicht gestartet werden."
            );

        }


        setStatus(
            "🎵 Song läuft!"
        );

    }

    catch (error) {

        console.error(error);

        setStatus(
            "❌ " + error.message
        );

    }

};

</script>

</body>
</html>
