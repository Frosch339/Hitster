<!DOCTYPE html> <html lang="de"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>A4 Karten Test 001-009</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script> <style> @page { size: A4 portrait; margin: 0; } * { box-sizing: border-box; } html, body { margin: 0; padding: 0; background: #ddd; font-family: Arial, Helvetica, sans-serif; } /* ========================= A4 SEITE ========================= */ .page { width: 210mm; height: 297mm; position: relative; background: white; margin: 10mm auto; page-break-after: always; } /* ========================= KARTE ========================= */ .card { position: absolute; width: 65mm; height: 65mm; overflow: hidden; } /* Positionen der 9 Karten 3 × 3 */ .card:nth-child(1) { left: 7.5mm; top: 7.5mm; } .card:nth-child(2) { left: 72.5mm; top: 7.5mm; } .card:nth-child(3) { left: 137.5mm; top: 7.5mm; } .card:nth-child(4) { left: 7.5mm; top: 72.5mm; } .card:nth-child(5) { left: 72.5mm; top: 72.5mm; } .card:nth-child(6) { left: 137.5mm; top: 72.5mm; } .card:nth-child(7) { left: 7.5mm; top: 137.5mm; } .card:nth-child(8) { left: 72.5mm; top: 137.5mm; } .card:nth-child(9) { left: 137.5mm; top: 137.5mm; } /* ========================= VORDERSEITE ========================= */ .front { background: #050505; display: flex; align-items: center; justify-content: center; } /* ========================= VINYL-RINGE ========================= */ .ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; border-style: solid; pointer-events: none; } .ring1 { width: 72mm; height: 72mm; border-width: 1.3mm; border-color: #00b8a9; } .ring2 { width: 62mm; height: 62mm; border-width: 1.5mm; border-color: #ff5c5c; } .ring3 { width: 52mm; height: 52mm; border-width: 1.3mm; border-color: #ffc857; } .ring4 { width: 42mm; height: 42mm; border-width: 1.4mm; border-color: #8b6cff; } /* ========================= OFFENE RINGE ========================= */ .open-ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; border-style: solid; pointer-events: none; } .open1 { width: 67mm; height: 67mm; border-width: 1.4mm; border-color: #ff8a3d; border-left-color: transparent; border-bottom-color: transparent; transform: translate(-50%, -50%) rotate(25deg); } .open2 { width: 56mm; height: 56mm; border-width: 1.4mm; border-color: #00d4ff; border-right-color: transparent; border-top-color: transparent; transform: translate(-50%, -50%) rotate(-20deg); } .open3 { width: 45mm; height: 45mm; border-width: 1.4mm; border-color: #ff4fa3; border-left-color: transparent; border-top-color: transparent; transform: translate(-50%, -50%) rotate(45deg); } /* ========================= QR-BEREICH ========================= */ .qr-area { position: relative; z-index: 10; width: 38mm; height: 38mm; background: white; padding: 1mm; display: flex; align-items: center; justify-content: center; } .qr { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; } .qr img, .qr canvas { width: 100% !important; height: 100% !important; display: block; } /* ========================= RÜCKSEITE ========================= */ .back { background: #91A88B; color: #050505; } /* ========================= INTERPRET ========================= */ .artist { position: absolute; z-index: 5; top: 7mm; left: 4mm; right: 4mm; text-align: center; font-size: 5mm; font-weight: 700; line-height: 1.1; } /* ========================= JAHR ========================= */ .year { position: absolute; z-index: 5; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: 17mm; font-weight: 900; } /* ========================= TITEL ========================= */ .title { position: absolute; z-index: 5; left: 4mm; right: 4mm; bottom: 6mm; text-align: center; font-size: 4.5mm; font-weight: 700; line-height: 1.15; } /* ========================= KARTENNUMMER ========================= */ .card-number { position: absolute; z-index: 10; left: 2.5mm; bottom: 2mm; font-size: 2.4mm; font-weight: 600; opacity: 0.65; } /* ========================= BILDSCHIRM ========================= */ @media screen { .page { box-shadow: 0 5px 20px rgba(0,0,0,0.2); } } /* ========================= DRUCK ========================= */ @media print { html, body { background: white; } .page { margin: 0; box-shadow: none; } } </style> </head> <body> <!-- ===================================================== SEITE 1 – VORDERSEITEN ===================================================== --> <div class="page" id="frontPage"> </div> <!-- ===================================================== SEITE 2 – RÜCKSEITEN ===================================================== --> <div class="page" id="backPage"> </div> <script> /* ===================================================== KARTEN ===================================================== */ const songs = [ { number: 1, artist: "Elvis Presley", year: "1959", title: "A Big Hunk o' Love" }, { number: 2, artist: "Elvis Presley", year: "1959", title: "A Big Hunk o' Love" }, { number: 3, artist: "Elvis Presley", year: "1959", title: "A Big Hunk o' Love" }, { number: 4, artist: "Elvis Presley", year: "1959", title: "A Big Hunk o' Love" }, { number: 5, artist: "Elvis Presley", year: "1959", title: "A Big Hunk o' Love" }, { number: 6, artist: "Elvis Presley", year: "1959", title: "A Big Hunk o' Love" }, { number: 7, artist: "Elvis Presley", year: "1959", title: "A Big Hunk o' Love" }, { number: 8, artist: "Elvis Presley", year: "1959", title: "A Big Hunk o' Love" }, { number: 9, artist: "Elvis Presley", year: "1959", title: "A Big Hunk o' Love" } ]; /* ===================================================== VORDERSEITEN ERSTELLEN ===================================================== */ const frontPage = document.getElementById("frontPage"); songs.forEach((song, index) => { const card = document.createElement("div"); card.className = "card front"; /* Vinyl-Ringe */ card.innerHTML = ` <div class="ring ring1"></div> <div class="ring ring2"></div> <div class="ring ring3"></div> <div class="ring ring4"></div> <div class="open-ring open1"></div> <div class="open-ring open2"></div> <div class="open-ring open3"></div> <div class="qr-area"> <div class="qr" id="qr-${song.number}"> </div> </div> `; frontPage.appendChild(card); /* QR-Code */ new QRCode( document.getElementById( `qr-${song.number}` ), { text: "https://frosch339.github.io/Hitster/?karte=" + song.number, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M } ); }); /* ===================================================== RÜCKSEITEN ERSTELLEN ===================================================== */ const backPage = document.getElementById("backPage"); songs.forEach(song => { const card = document.createElement("div"); card.className = "card back"; card.innerHTML = ` <div class="artist"> ${song.artist} </div> <div class="year"> ${song.year} </div> <div class="title"> ${song.title} </div> <div class="card-number"> #${String(song.number).padStart(3, "0")} </div> `; backPage.appendChild(card); }); </script> </body> </html>
