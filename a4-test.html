<html lang="de">

   A4
===================================================== */

.page {

  position: relative;

  width: 210mm;
  height: 297mm;

  background: white;

  margin: 10mm auto;

  page-break-after: always;
}


/* =====================================================
   KARTE
===================================================== */

.card {

  position: absolute;

  width: 65mm;
  height: 65mm;

  overflow: hidden;

}


/* =====================================================
   POSITIONEN
===================================================== */

.card:nth-child(1) {
  left: 7.5mm;
  top: 7.5mm;
}

.card:nth-child(2) {
  left: 72.5mm;
  top: 7.5mm;
}

.card:nth-child(3) {
  left: 137.5mm;
  top: 7.5mm;
}

.card:nth-child(4) {
  left: 7.5mm;

}

  left: 72.5mm;
  top: 72.5mm;
}

.card:nth-child(6) {
  left: 137.5mm;
  top: 72.5mm;
}

.card:nth-child(7) {
  left: 7.5mm;
  top: 137.5mm;
}

.card:nth-child(8) {
  left: 72.5mm;
  top: 137.5mm;
}

.card:nth-child(9) {

/* =====================================================
   VORDERSEITE
===================================================== */

.front {

  background: #050505;

  display: flex;

  align-items: center;
  justify-content: center;

}


/* =====================================================
   VINYL-RINGE
===================================================== */

.ring {

  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  border-style: solid;

  pointer-events: none;

}


.ring1 {

  width: 72mm;
  height: 72mm;

  border-width: 1.3mm;

  border-color: #00b8a9;

}


.ring2 {

  width: 62mm;
  height: 62mm;

  border-width: 1.5mm;

  border-color: #ff5c5c;

}


.ring3 {

  width: 52mm;
  height: 52mm;

  border-width: 1.3mm;

  border-color: #ffc857;

}


.ring4 {

  width: 42mm;
  height: 42mm;

  border-width: 1.4mm;

  border-color: #8b6cff;

}


/* =====================================================
   OFFENE RINGE
===================================================== */

.open-ring {

  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  border-style: solid;

  pointer-events: none;

}


.open1 {

  width: 67mm;
  height: 67mm;

  border-width: 1.4mm;

  border-color: #ff8a3d;

  border-left-color: transparent;
  border-bottom-color: transparent;

  transform:
    translate(-50%, -50%)
    rotate(25deg);

}


.open2 {

  width: 56mm;
  height: 56mm;

  border-width: 1.4mm;

  border-color: #00d4ff;

  border-right-color: transparent;
  border-top-color: transparent;

  transform:
    translate(-50%, -50%)
    rotate(-20deg);

}


.open3 {

  width: 45mm;
  height: 45mm;

  border-width: 1.4mm;

  border-color: #ff4fa3;

  border-left-color: transparent;
  border-top-color: transparent;

  transform:
    translate(-50%, -50%)
    rotate(45deg);

}


/* =====================================================
   QR
===================================================== */

.qr-area {

  position: relative;

  z-index: 10;

  width: 38mm;
  height: 38mm;

  background: white;

  padding: 1mm;

  display: flex;

  align-items: center;
  justify-content: center;

}


.qr {

  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

}


.qr img,
.qr canvas {

  width: 100% !important;
  height: 100% !important;

  display: block;

}


/* =====================================================
   RÜCKSEITE
===================================================== */

.back {

  background: #91A88B;

  color: #050505;

}


/* =====================================================
   INTERPRET
===================================================== */

.artist {

  position: absolute;

  top: 7mm;

  left: 4mm;
  right: 4mm;

  text-align: center;

  font-size: 5mm;

  font-weight: 700;

}


/* =====================================================
   JAHR
===================================================== */

.year {

  position: absolute;

  top: 50%;

  left: 0;
  right: 0;

  transform: translateY(-50%);

  text-align: center;

  font-size: 17mm;

  font-weight: 900;

}


/* =====================================================
   TITEL
===================================================== */

.title {

  position: absolute;

  bottom: 6mm;

  left: 4mm;
  right: 4mm;

  text-align: center;

  font-size: 4.5mm;

  font-weight: 700;

  line-height: 1.15;

}


/* =====================================================
   NUMMER
===================================================== */

.card-number {

  position: absolute;

  left: 2.5mm;
  bottom: 2mm;

  font-size: 2.4mm;

  font-weight: 600;

  opacity: 0.65;

}


/* =====================================================
   SCHNITTMARKEN
===================================================== */

/*
   Die Marken liegen außerhalb der Karten.
   Sie zeigen die vier Ecken jeder Karte.
*/

.cut {

  position: absolute;

  background: #000;

}


/* horizontale Marken */

.cut-h {

  width: 4mm;
  height: 0.25mm;

}


/* vertikale Marken */

.cut-v {

  width: 0.25mm;
  height: 4mm;

}


/* =====================================================
   DRUCK
===================================================== */

@media print {

  html,
  body {

    background: white;

  }

  .page {

    margin: 0;

  }

}

</style>
</head>
