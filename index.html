<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Hitster</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      width: 90%;
      max-width: 400px;
      background: #222;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      font-size: 32px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .spotify {
      background: #1DB954;
      color: black;
    }

    .solution {
      background: white;
      color: black;
    }

    #answer {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #333;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div>MEIN HITSTER</div>

    <h1 id="cardNumber">Karte #001</h1>

    <p>Song abspielen und erst danach die Lösung aufdecken.</p>

    <button class="spotify" onclick="openSpotify()">
      🎵 In Spotify öffnen
    </button>

    <button class="solution" onclick="showSolution()">
      🔓 Lösung aufdecken
    </button>

    <div id="answer"></div>

  </div>

  <script>

    const songs = [
      {
        artist: "Elvis Presley",
        title: "A Big Hunk o' Love",
        year: 1959
      },
      {
        artist: "Buddy Holly",
        title: "Peggy Sue",
        year: 1957
      },
      {
        artist: "Jerry Lee Lewis",
        title: "Great Balls of Fire",
        year: 1957
      }
    ];

    let cardNumber = new URLSearchParams(window.location.search).get("karte");

    if (!cardNumber) {
      cardNumber = 1;
    }

    cardNumber = parseInt(cardNumber);

    if (cardNumber < 1 || cardNumber > songs.length) {
      cardNumber = 1;
    }

    const song = songs[cardNumber - 1];

    document.getElementById("cardNumber").textContent =
      "Karte #" + String(cardNumber).padStart(3, "0");

    function openSpotify() {

      const search =
        song.artist + " " + song.title;

      window.location.href =
        "https://open.spotify.com/search/" +
        encodeURIComponent(search);
    }

    function showSolution() {

      const answer = document.getElementById("answer");

      answer.innerHTML =
        "<strong>" + song.artist + "</strong><br>" +
        song.title + "<br><br>" +
        "<strong>" + song.year + "</strong>";

      answer.style.display = "block";
    }

  </script>

</body>
</html>
