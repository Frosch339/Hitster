songs.forEach(song => {

  const key =
    song.artist.trim().toLowerCase() +
    "||" +
    song.title.trim().toLowerCase();

  if (!usedSongs.has(key)) {

    usedSongs.add(key);

    uniqueSongs.push({
      artist: song.artist,
      title: song.title,
      year: song.year
    });

  }

});

additionalSongs.forEach(song => {

  if (uniqueSongs.length >= 1000) {
    return;
  }

  const key =
    song.artist.trim().toLowerCase() +
    "||" +
    song.title.trim().toLowerCase();

  if (!usedSongs.has(key)) {

    usedSongs.add(key);

    uniqueSongs.push({
      artist: song.artist,
      title: song.title,
      year: song.year
    });

  }

});

  song.id = index + 1;
});

async function getSpotifyAccessToken() {

  let token =
    localStorage.getItem(
      "spotify_access_token"
    );

  const expiresAt =
    Number(
      localStorage.getItem(
        "spotify_token_expires_at"
      )
    );


  /*
   * Token ist noch gültig.
   */
  if (
    token &&
    expiresAt &&
    Date.now() < expiresAt - 60000
  ) {

    return token;

  }


  /*
   * Token ist abgelaufen.
   * Jetzt Refresh Token benutzen.
   */

  const refreshToken =
    localStorage.getItem(
      "spotify_refresh_token"
    );


  if (!refreshToken) {

    throw new Error(
      "Spotify muss erneut verbunden werden."
    );

  }


  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          new URLSearchParams({

            grant_type:
              "refresh_token",

            refresh_token:
              refreshToken,

            client_id:
              CLIENT_ID

          })

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    /*
     * Refresh Token ungültig.
     */
    if (
      data.error ===
      "invalid_grant"
    ) {

      localStorage.removeItem(
        "spotify_access_token"
      );

      localStorage.removeItem(
        "spotify_refresh_token"
      );

      localStorage.removeItem(
        "spotify_token_expires_at"
      );

      throw new Error(
        "Spotify-Verbindung abgelaufen. Bitte erneut verbinden."
      );

    }


    throw new Error(
      data.error_description ||
      "Spotify Token konnte nicht erneuert werden."
    );

  }


  /*
   * Neuen Access Token speichern.
   */

  localStorage.setItem(
    "spotify_access_token",
    data.access_token
  );


  localStorage.setItem(
    "spotify_token_expires_at",

    String(
      Date.now() +
      data.expires_in * 1000
    )
  );


  /*
   * Falls Spotify einen neuen
   * Refresh Token liefert.
   */

  if (data.refresh_token) {

    localStorage.setItem(
      "spotify_refresh_token",
      data.refresh_token
    );

  }


  return data.access_token;

}


/* =====================================================
   SPOTIFY PLAYER
===================================================== */

window.onSpotifyWebPlaybackSDKReady =
async () => {

  try {

    await getSpotifyAccessToken();


    spotifyPlayer =
      new Spotify.Player({

        name: "Hitster",

        getOAuthToken:
          async callback => {

            try {

              const token =
                await getSpotifyAccessToken();

              callback(token);

            }
            catch (error) {

              console.error(
                error
              );

            }

          },

        volume: 0.8

      });


    /*
     * Player bereit
     */

    spotifyPlayer.addListener(
      "ready",

      ({ device_id }) => {

        spotifyDeviceId =
          device_id;

        spotifyPlayerReady =
          true;

        console.log(
          "Spotify Player bereit:",
          device_id
        );

      }
    );


    /*
     * Player nicht mehr verfügbar
     */

    spotifyPlayer.addListener(
      "not_ready",

      () => {

        spotifyPlayerReady =
          false;

      }
    );


    /*
     * Fehler
     */

    spotifyPlayer.addListener(
      "initialization_error",

      ({ message }) => {

        console.error(
          "Spotify Initialisierungsfehler:",
          message
        );

      }
    );


    spotifyPlayer.addListener(
      "authentication_error",

      ({ message }) => {

        console.error(
          "Spotify Authentifizierungsfehler:",
          message
        );

      }
    );


    spotifyPlayer.addListener(
      "account_error",

      ({ message }) => {

        console.error(
          "Spotify Account-Fehler:",
          message
        );

      }
    );


    spotifyPlayer.addListener(
      "playback_error",

      ({ message }) => {

        console.error(
          "Spotify Wiedergabefehler:",
          message
        );

      }
    );


    /*
     * Player verbinden
     */

    await spotifyPlayer.connect();

  }

  catch (error) {

    console.error(
      "Spotify Player konnte nicht gestartet werden:",
      error
    );

  }

};


/* =====================================================
   SONG STARTEN
===================================================== */

  document.getElementById('play').onclick =
async () => {

  const button =
    document.getElementById('play');

  const pauseButton =
    document.getElementById('pause');

  try {

    button.disabled =
      true;

    button.textContent =
      "⏳ Song wird gestartet...";


    const token =
      await getSpotifyAccessToken();


    if (
      !spotifyPlayerReady ||
      !spotifyDeviceId
    ) {

      throw new Error(
        "Spotify Player ist noch nicht bereit. Bitte kurz warten und erneut drücken."
      );

    }


    if (
      spotifyPlayer &&
      spotifyPlayer.activateElement
    ) {

      await spotifyPlayer.activateElement();

    }


    const query =
      encodeURIComponent(
        `artist:${s[0]} track:${s[1]}`
      );


    const searchResponse =
      await fetch(

        "https://api.spotify.com/v1/search" +
        "?q=" +
        query +
        "&type=track&limit=5",

        {

          headers: {

            Authorization:
              "Bearer " + token

          }

        }

      );


    const searchData =
      await searchResponse.json();


    if (!searchResponse.ok) {

      throw new Error(
        searchData.error?.message ||
        "Spotify-Suche fehlgeschlagen."
      );

    }


    const tracks =
      searchData.tracks?.items ||
      [];


    if (
      tracks.length === 0
    ) {

      throw new Error(
        "Song wurde bei Spotify nicht gefunden."
      );

    }


    const track =
      tracks.find(
        t =>
          t.artists?.some(
            artist =>
              artist.name
                .toLowerCase() ===
              s[0].toLowerCase()
          )
      ) ||
      tracks[0];


    console.log(
      "Gefundener Song:",
      track.name,
      "-",
      track.artists
        .map(a => a.name)
        .join(", ")
    );


    const playResponse =
      await fetch(

        "https://api.spotify.com/v1/me/player/play" +
        "?device_id=" +
        encodeURIComponent(
          spotifyDeviceId
        ),

        {

          method: "PUT",

          headers: {

            Authorization:
              "Bearer " + token,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              uris: [
                track.uri
              ]

            })

        }

      );


    if (!playResponse.ok) {

      let errorData = {};

      try {

        errorData =
          await playResponse.json();

      }
      catch (e) {}

      throw new Error(
        errorData.error?.message ||
        "Wiedergabe konnte nicht gestartet werden."
      );

    }


    button.textContent =
      "🎵 Song läuft";

    pauseButton.disabled =
      false;

    pauseButton.textContent =
      "⏸ Pause";

  }

  catch (error) {

    console.error(
      error
    );

    alert(
      "Spotify-Fehler:\n\n" +
      error.message
    );

    button.textContent =
      "🎵 Song starten";

  }

  finally {

    button.disabled =
      false;

  }

};


/*
 * Pause / Weiter
 */

document.getElementById('pause').onclick =
async () => {

  const pauseButton =
    document.getElementById('pause');

  try {

    if (!spotifyPlayer) {
      return;
    }

    const state =
      await spotifyPlayer.getCurrentState();

    if (!state) {
      return;
    }


    if (state.paused) {

      await spotifyPlayer.resume();

      pauseButton.textContent =
        "⏸ Pause";

    }

    else {

      await spotifyPlayer.pause();

      pauseButton.textContent =
        "▶️ Weiter";

    }

  }

  catch (error) {

    console.error(
      "Pause/Weiter Fehler:",
      error
    );

  }

};
