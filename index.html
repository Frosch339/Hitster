<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eigenes HITSTER – 1000 Karten</title>

<script src="https://sdk.scdn.co/spotify-player.js"></script>

<style>
body{
  font-family:system-ui,-apple-system,sans-serif;
  margin:0;
  background:#111;
  color:#fff;
  display:flex;
  min-height:100vh;
  align-items:center;
  justify-content:center
}

.card{
  width:min(430px,92vw);
  background:#1d1d1d;
  border-radius:22px;
  padding:28px;
  box-sizing:border-box;
  text-align:center
}

.small{
  color:#aaa;
  font-size:13px
}

button{
  width:100%;
  padding:16px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:700;
  cursor:pointer
}

button:disabled{
  opacity:0.6;
  cursor:wait
}

.play{
  background:#1db954;
  color:#000
}

.reveal{
  background:#fff;
  color:#111
}

#answer{
  display:none;
  margin-top:22px;
  padding:18px;
  background:#292929;
  border-radius:15px
}
</style>
</head>

<body>

<main class="card">

<div class="small">
EIGENES HITSTER · 1000 KARTEN
</div>

<h1 id="num">Karte #001</h1>

<p>
Song abspielen und erst danach die Lösung aufdecken.
</p>

<button class="play" id="play">
  🎵 Song starten
</button>

<button class="play" id="pause" disabled>
  ⏸ Pause
</button>

  <button class="play" id="scan">
  📷 Nächste Karte scannen
</button>

<button class="reveal" id="rev">
🔓 Lösung aufdecken
</button>

<div id="answer"></div>

</main>

<script src="./songs.js"></script>

<script>

const CLIENT_ID =
  "fc0ca59e363f454ca125c7dcdf6b723c";

let spotifyPlayer = null;
let spotifyDeviceId = null;
let spotifyPlayerReady = false;


/* =====================================================
   SONGE
===================================================== */

// Die Songdaten liegen jetzt separat in songs.js.
const songs = window.songs || [];

if (songs.length === 0) {
  console.error("Die Songliste konnte nicht geladen werden. Prüfe, ob songs.js im selben GitHub-Ordner liegt.");
}

/* =====================================================
   KARTE ERMITTELN
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

let n =
  parseInt(
    params.get('karte') ||
    params.get('card') ||
    '1',
    10
  );

if (
  !Number.isFinite(n) ||
  n < 1 ||
  n > songs.length
) {
  n = 1;
}

const s =
  songs[n - 1];


document.getElementById('num').textContent =
  'Karte #' +
  String(n).padStart(3,'0');


/* =====================================================
   SPOTIFY TOKEN
===================================================== */

async function getSpotifyAccessToken() {

  let token =
    localStorage.getItem(
      "spotify_access_token"
    );

  const expiresAt =
    Number(
      localStorage.getItem(
        "spotify_token_expires_at"
      )
    );


  /*
   * Token ist noch gültig.
   */
  if (
    token &&
    expiresAt &&
    Date.now() < expiresAt - 60000
  ) {

    return token;

  }


  /*
   * Token ist abgelaufen.
   * Jetzt Refresh Token benutzen.
   */

  const refreshToken =
    localStorage.getItem(
      "spotify_refresh_token"
    );


if (!refreshToken) {

  const currentCard =
    new URLSearchParams(
      window.location.search
    ).get("karte");

  if (currentCard) {

    localStorage.setItem(
      "spotify_return_url",
      "https://frosch339.github.io/Hitster/?karte=" +
      currentCard
    );

  }

  window.location.href =
    "https://frosch339.github.io/Hitster/spotify.html";

  return null;
}


  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          new URLSearchParams({

            grant_type:
              "refresh_token",

            refresh_token:
              refreshToken,

            client_id:
              CLIENT_ID

          })

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    /*
     * Refresh Token ungültig.
     */
    if (
      data.error ===
      "invalid_grant"
    ) {

      localStorage.removeItem(
        "spotify_access_token"
      );

      localStorage.removeItem(
        "spotify_refresh_token"
      );

      localStorage.removeItem(
        "spotify_token_expires_at"
      );

      throw new Error(
        "Spotify-Verbindung abgelaufen. Bitte erneut verbinden."
      );

    }


    throw new Error(
      data.error_description ||
      "Spotify Token konnte nicht erneuert werden."
    );

  }


  /*
   * Neuen Access Token speichern.
   */

  localStorage.setItem(
    "spotify_access_token",
    data.access_token
  );


  localStorage.setItem(
    "spotify_token_expires_at",

    String(
      Date.now() +
      data.expires_in * 1000
    )
  );


  /*
   * Falls Spotify einen neuen
   * Refresh Token liefert.
   */

  if (data.refresh_token) {

    localStorage.setItem(
      "spotify_refresh_token",
      data.refresh_token
    );

  }


  return data.access_token;

}


/* =====================================================
   SPOTIFY PLAYER
===================================================== */

window.onSpotifyWebPlaybackSDKReady =
async () => {

  try {

    await getSpotifyAccessToken();


    spotifyPlayer =
      new Spotify.Player({

        name: "Hitster",

        getOAuthToken:
          async callback => {

            try {

              const token =
                await getSpotifyAccessToken();

              callback(token);

            }
            catch (error) {

              console.error(
                error
              );

            }

          },

        volume: 0.8

      });


    /*
     * Player bereit
     */

spotifyPlayer.addListener(
  "ready",

  ({ device_id }) => {

    spotifyDeviceId = device_id;

    spotifyPlayerReady = true;

    console.log(
      "✅ Spotify Player bereit:",
      device_id
    );

  }
);

    /*
     * Player nicht mehr verfügbar
     */

    spotifyPlayer.addListener(
      "not_ready",

      () => {

        spotifyPlayerReady =
          false;

      }
    );


    /*
     * Fehler
     */

    spotifyPlayer.addListener(
      "initialization_error",

      ({ message }) => {

        console.error(
          "Spotify Initialisierungsfehler:",
          message
        );

      }
    );


    spotifyPlayer.addListener(
      "authentication_error",

      ({ message }) => {

        console.error(
          "Spotify Authentifizierungsfehler:",
          message
        );

      }
    );


    spotifyPlayer.addListener(
      "account_error",

      ({ message }) => {

        console.error(
          "Spotify Account-Fehler:",
          message
        );

      }
    );


    spotifyPlayer.addListener(
      "playback_error",

      ({ message }) => {

        console.error(
          "Spotify Wiedergabefehler:",
          message
        );

      }
    );


    /*
     * Player verbinden
     */

    await spotifyPlayer.connect();

  }

  catch (error) {

  console.error(
    "Spotify Player konnte nicht gestartet werden:",
    error
  );

  /*
   * Keine Spotify-Verbindung vorhanden:
   * Zur Spotify-Anmeldung weiterleiten.
   */

  if (
    error.message.includes(
      "Spotify muss erneut verbunden werden"
    ) ||
    error.message.includes(
      "Spotify-Verbindung abgelaufen"
    )
  ) {

    const currentUrl =
      window.location.pathname +
      window.location.search;

    localStorage.setItem(
      "spotify_return_url",
      currentUrl
    );

    window.location.href =
      "https://frosch339.github.io/Hitster/spotify.html";

  }


  }

};


/* =====================================================
   SONG STARTEN
===================================================== */

  document.getElementById('play').onclick =
async () => {

  const button =
    document.getElementById('play');

  const pauseButton =
    document.getElementById('pause');

  try {

    button.disabled =
      true;

    button.textContent =
      "⏳ Song wird gestartet...";


    const token =
      await getSpotifyAccessToken();


    if (
      !spotifyPlayerReady ||
      !spotifyDeviceId
    ) {

      throw new Error(
        "Spotify Player ist noch nicht bereit. Bitte kurz warten und erneut drücken."
      );

    }


    if (
      spotifyPlayer &&
      spotifyPlayer.activateElement
    ) {

      await spotifyPlayer.activateElement();

    }

    if (!s || !s.artist || !s.title) {

  throw new Error(

    "Kein Song für Karte " + n +

    " gefunden. Bitte songs.js und Kartennummer prüfen."

  );

}

const query =
  encodeURIComponent(
    `artist:${s.artist} track:${s.title}`
  );

    const searchResponse =
      await fetch(

        "https://api.spotify.com/v1/search" +
        "?q=" +
        query +
        "&type=track&limit=5",

        {

          headers: {

            Authorization:
              "Bearer " + token

          }

        }

      );


    const searchData =
      await searchResponse.json();


    if (!searchResponse.ok) {

      throw new Error(
        searchData.error?.message ||
        "Spotify-Suche fehlgeschlagen."
      );

    }


    const tracks =
      searchData.tracks?.items ||
      [];


    if (
      tracks.length === 0
    ) {

      throw new Error(
        "Song wurde bei Spotify nicht gefunden."
      );

    }


const track =
  tracks.find(
    t =>
      t.artists?.some(
        artist =>
          artist.name
            .toLowerCase() ===
          s.artist.toLowerCase()
      )
  ) ||
  tracks[0];


    console.log(
      "Gefundener Song:",
      track.name,
      "-",
      track.artists
        .map(a => a.name)
        .join(", ")
    );


    const playResponse =
      await fetch(

        "https://api.spotify.com/v1/me/player/play" +
        "?device_id=" +
        encodeURIComponent(
          spotifyDeviceId
        ),

        {

          method: "PUT",

          headers: {

            Authorization:
              "Bearer " + token,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              uris: [
                track.uri
              ]

            })

        }

      );


    if (!playResponse.ok) {

      let errorData = {};

      try {

        errorData =
          await playResponse.json();

      }
      catch (e) {}

      throw new Error(
        errorData.error?.message ||
        "Wiedergabe konnte nicht gestartet werden."
      );

    }


    button.textContent =
      "🎵 Song läuft";

    pauseButton.disabled =
      false;

    pauseButton.textContent =
      "⏸ Pause";

  }

  catch (error) {

    console.error(
      error
    );

    alert(
      "Spotify-Fehler:\n\n" +
      error.message
    );

    button.textContent =
      "🎵 Song starten";

  }

  finally {

    button.disabled =
      false;

  }

};


/*
 * Pause / Weiter
 */

document.getElementById('pause').onclick =
async () => {

  const pauseButton =
    document.getElementById('pause');

  try {

    if (!spotifyPlayer) {
      return;
    }

    const state =
      await spotifyPlayer.getCurrentState();

    if (!state) {
      return;
    }


    if (state.paused) {

      await spotifyPlayer.resume();

      pauseButton.textContent =
        "⏸ Pause";

    }

    else {

      await spotifyPlayer.pause();

      pauseButton.textContent =
        "▶️ Weiter";

    }

  }

  catch (error) {

    console.error(
      "Pause/Weiter Fehler:",
      error
    );

  }

};

  document.getElementById('scan').onclick = () => {
  window.location.href = './scanner.html';
    };

/* =====================================================
   LÖSUNG AUFDECKEN
===================================================== */

document.getElementById('rev').onclick =
() => {

  const a =
    document.getElementById(
      'answer'
    );


  a.style.display =
    'block';


 a.innerHTML =
  '<b>' +
  s.artist +
  '</b><br>' +
  s.title +
  '<br><strong>' +
  s.year +
  '</strong>';


  document.getElementById(
    'rev'
  ).disabled =
    true;

};

 
</script>

</body>
</html>
