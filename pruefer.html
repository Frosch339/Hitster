
```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitster – Song-Prüfer</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 18px;
  background: #121212; color: white;
  font-family: Arial, sans-serif;
}
main {
  max-width: 650px; margin: auto;
  padding: 22px; background: #202020;
  border-radius: 14px;
}
h1 { font-size: 25px; }
.muted { color: #aaa; font-size: 14px; }
button, input {
  width: 100%; padding: 13px; margin-top: 10px;
  border: 0; border-radius: 8px; font-size: 16px;
}
button { cursor: pointer; font-weight: bold; }
.spotify { background: #1ed760; color: #111; }
.secondary { background: #383838; color: white; }
.correct { background: #287d46; color: white; }
.wrong { background: #a93636; color: white; }
iframe {
  width: 100%; height: 152px;
  border: 0; border-radius: 12px; margin-top: 15px;
}
.navigation { display: flex; gap: 10px; }
.navigation button { flex: 1; }
#status {
  margin-top: 15px; padding: 12px;
  background: #303030; border-radius: 8px;
}
</style>
</head>
<body>
<main>
  <div class="muted">EIGENES HITSTER · SONG-PRÜFER</div>
  <h1 id="card">Song wird geladen ...</h1>
  <p id="progress" class="muted"></p>

  <h2 id="title"></h2>
  <p id="artist"></p>
  <p id="year" class="muted"></p>

  <button id="search" class="spotify">
    Spotify-Suche im Browser öffnen
  </button>

  <p class="muted">
    Wähle in Spotify den passenden Treffer. Kopiere anschließend
    dessen Track-Link in das Feld unten, damit du ihn hier abspielen kannst.
  </p>

  <input id="trackUrl"
    placeholder="Spotify-Track-Link hier einfügen">

  <button id="load" class="secondary">
    Track hier anzeigen und abspielen
  </button>

  <div id="player"></div>

  <button id="correct" class="correct">
    ✓ Richtige Version
  </button>
  <button id="wrong" class="wrong">
    ✗ Falsche Version / Problem
  </button>

  <div id="status">Noch nicht geprüft</div>

  <h3>Eintrag für songs.js</h3>
<textarea id="songEntry" rows="7" readonly
  style="width:100%; padding:10px; border-radius:8px;
  box-sizing:border-box; background:#303030; color:white;">
</textarea>
<button id="copyEntry" class="secondary">
  Eintrag kopieren
</button>

  <div class="navigation">
    <button id="previous" class="secondary">← Zurück</button>
    <button id="next" class="secondary">Nächster Song →</button>
  </div>
  <button id="unmark" class="secondary">Markierung entfernen</button>
  <button id="exportSongs" class="spotify">
  Geprüfte Songs als songs.js herunterladen
</button>
</main>

<script src="./songs.js"></script>
<script>
(() => {
  const songs = window.songs || [];
  const el = id => document.getElementById(id);

  if (!songs.length) {
    el("card").textContent =
      "Fehler: songs.js wurde nicht geladen.";
    return;
  }

  const statusKey = "hitsterManualCheckStatus";
  const trackKey = "hitsterSpotifyTrackLinks";
  let statuses = {};
  let trackLinks = {};

  try {
    statuses = JSON.parse(localStorage.getItem(statusKey) || "{}");
    trackLinks = JSON.parse(localStorage.getItem(trackKey) || "{}");
  } catch {}

  const params = new URLSearchParams(location.search);
  let index = Math.max(0, Math.min(
    songs.length - 1,
    (Number(params.get("karte") || params.get("card")) || 1) - 1
  ));

  const songId = song => String(song.id ?? songs.indexOf(song) + 1);

function updateSongEntry() {
  const song = songs[index];
  const id = songId(song);

  const url = trackLinks[id] ||
    (song.spotifyId
      ? "https://open.spotify.com/track/" + song.spotifyId
      : "");

  const match = url.match(
    /(?:track\/|spotify:track:)([A-Za-z0-9]+)/
  );

  if (!match || statuses[id] !== "correct") {
    el("songEntry").value =
      "1. Spotify-Link einfügen und laden.\n" +
      "2. Song anhören und prüfen.\n" +
      "3. Auf „Richtige Version“ klicken.";
    return;
  }

  const entry = {
    ...song,
    spotifyId: match[1]
  };

  el("songEntry").value =
    JSON.stringify(entry, null, 2) + ",";
}
  
  function save() {
    localStorage.setItem(statusKey, JSON.stringify(statuses));
    localStorage.setItem(trackKey, JSON.stringify(trackLinks));
  }

  function render() {
    const song = songs[index];
    const id = songId(song);

    el("card").textContent =
      "Karte #" + String(index + 1).padStart(3, "0");
    el("progress").textContent =
      `Song ${index + 1} von ${songs.length}`;
    el("title").textContent = song.title || "Unbekannter Titel";
    el("artist").textContent = "Interpret: " + (song.artist || "Unbekannt");
    el("year").textContent = "Jahr in deiner Liste: " + (song.year || "Unbekannt");
    el("trackUrl").value = trackLinks[id] || "";
    updateSongEntry();
    el("player").innerHTML = "";

    const status = statuses[id];
    el("status").textContent =
      status === "correct" ? "✓ Als richtig markiert" :
      status === "wrong" ? "✗ Als problematisch markiert" :
      "Noch nicht geprüft";

    el("search").onclick = () => {
      const query = encodeURIComponent(
        (song.artist || "") + " " + (song.title || "")
      );
      window.open("https://open.spotify.com/search/" + query, "spotifySearch");
      );
    };

    el("load").onclick = () => {
      const value = el("trackUrl").value.trim();
      const match = value.match(
        /(?:track\/|spotify:track:)([A-Za-z0-9]+)/
      );

      if (!match) {
        alert("Bitte einen gültigen Spotify-Track-Link einfügen.");
        return;
      }

      trackLinks[id] = "https://open.spotify.com/track/" + match[1];
      save();
      updateSongEntry();
      el("player").innerHTML =
        '<iframe title="Spotify-Player" ' +
        'src="https://open.spotify.com/embed/track/' +
        match[1] +
        '?utm_source=generator" ' +
        'allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" ' +
        'loading="lazy"></iframe>';
    };

    el("correct").onclick = () => {
  statuses[id] = "correct";
  save();
  render();
};

el("wrong").onclick = () => {
  statuses[id] = "wrong";
  save();
  render();
};

el("unmark").onclick = () => {
  delete statuses[id];
  save();
  render();
};

el("copyEntry").onclick = async () => {
  const text = el("songEntry").value;

  if (statuses[songId(songs[index])] !== "correct") {
    alert("Bitte zuerst den Song prüfen und als richtig markieren.");
    return;
  }

  if (!text.includes('"spotifyId"')) {
    alert("Bitte zuerst einen gültigen Spotify-Link laden.");
    return;
  }

  try {
    await navigator.clipboard.writeText(text);
    alert("Eintrag wurde kopiert!");
  } catch {
    el("songEntry").select();
    alert("Bitte den markierten Eintrag manuell kopieren.");
  }
};

el("previous").onclick = () => {
  index = (index - 1 + songs.length) % songs.length;
  render();
};

el("exportSongs").onclick = () => {
  let updatedCount = 0;

  const updatedSongs = songs.map(song => {
    const id = songId(song);

    // Nur bestätigte Songs mit gespeichertem Link übernehmen
    if (statuses[id] !== "correct") {
      return song;
    }

    const url = trackLinks[id] || "";
    const match = url.match(
      /(?:track\/|spotify:track:)([A-Za-z0-9]+)/
    );

    if (!match) {
      return song;
    }

    updatedCount++;

    return {
      ...song,
      spotifyId: match[1]
    };
  });

  if (updatedCount === 0) {
    alert(
      "Noch keine bestätigten Songs mit Spotify-Link gefunden."
    );
    return;
  }

  const fileContent =
    "// Songliste für dein HITSTER-Spiel.\n" +
    "window.songs = " +
    JSON.stringify(updatedSongs, null, 2) +
    ";\n";

  const blob = new Blob(
    [fileContent],
    { type: "text/javascript;charset=utf-8" }
  );

  const downloadUrl = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = downloadUrl;
  link.download = "songs.js";
  link.click();

  URL.revokeObjectURL(downloadUrl);

  alert(
    updatedCount +
    " bestätigte Spotify-IDs wurden in die neue songs.js übernommen."
  );
};
})();
</script>
</body>
</html>
